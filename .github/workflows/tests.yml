name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Gradle Wrapper validado
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Garantir execucao do gradlew
        run: chmod +x gradlew

      - name: Testes unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug e teste instrumentado
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
